name: nix

# Verifies the Nix build on every code change. Docs-only commits are skipped
# (paths-ignore) and, at the derivation level, the lib.fileset src filter keeps a
# doc/nix-only change from busting the workspace build cache.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Defaults to a GitHub-hosted runner. Set the repo variable ASMLTR_CI_RUNNER
    # to a self-hosted label (e.g. one on Jareth's VM) to move there with no edit;
    # a self-hosted runner keeps /nix/store on disk, so the cache step below becomes
    # a no-op win.
    runs-on: ${{ vars.ASMLTR_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Persist /nix/store across runs via GitHub's OWN Actions cache (no third
      # party). Keyed on the nix + lockfiles; unrelated commits restore the prior
      # store and only what changed is realized. GitHub's cache is ~10 GB with LRU
      # eviction, so gc keeps the stored closure under the ceiling.
      - name: Cache /nix/store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock', '**/package-lock.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Flake check
        run: nix flake check -L

      - name: Build packages
        run: nix build -L .#asmltr-workspace .#asmltr-dashboard
