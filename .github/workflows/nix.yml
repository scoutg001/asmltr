name: nix

# Verifies the Nix build on every code change. Docs-only commits are skipped
# (paths-ignore). At the derivation level, nix/package.nix builds from a lib.fileset
# that includes only the workspace sources (root manifests + the four workspaces +
# shared/integrations/scripts/setup.d) and excludes docs, *.md, nix/, and the
# dashboard, so a docs-only edit does not change the workspace src hash and its build
# cache holds.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Defaults to a GitHub-hosted runner. Set the repo variable ASMLTR_CI_RUNNER
    # to a self-hosted label (e.g. one on Jareth's VM) to move there with no edit;
    # a self-hosted runner keeps /nix/store on disk, so the cache step below becomes
    # a no-op win.
    runs-on: ${{ vars.ASMLTR_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # The nixosTest boots a QEMU VM, which needs /dev/kvm reachable by the nix
      # daemon's build users (nixbld). GitHub's Linux runners expose /dev/kvm; this
      # udev rule widens its perms so nixbld can use it. No-op on a runner without
      # KVM (the VM test then fails loudly, which is the signal to move it to a
      # KVM-capable self-hosted runner via ASMLTR_CI_RUNNER).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        # Pinned to a released tag, not @main: a branch ref resolves to the tip at
        # run time and runs with the workflow GITHUB_TOKEN, so a changed upstream
        # main would silently alter every CI run. v22 is the latest release.
        uses: DeterminateSystems/nix-installer-action@v22

      # Persist /nix/store across runs via GitHub's OWN Actions cache (no third
      # party). Keyed on the nix + lockfiles; unrelated commits restore the prior
      # store and only what changed is realized. GitHub's cache is ~10 GB with LRU
      # eviction, so gc keeps the stored closure under the ceiling.
      - name: Cache /nix/store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock', '**/package-lock.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          # Purge only caches OLDER than 3 days (259200s), not every non-current key
          # (purge-created:0). The primary key is hash-derived over the nix + lock
          # files, so two active branches have different keys; 0 made each run evict
          # the other branch's fresh cache, forcing a cold rebuild. gc-max-store-size
          # + LRU still bound the store under GitHub's ~10 GB ceiling.
          purge-created: 259200
          purge-primary-key: never

      - name: Flake check
        run: nix flake check -L

      - name: Build packages
        # Include the aggregate (.#asmltr, the flake default): nix flake check
        # evaluates packages but never realizes them, so without this the
        # aggregate's build phase never runs in CI and a broken assembly ships green.
        run: nix build -L .#asmltr .#asmltr-workspace .#asmltr-dashboard
